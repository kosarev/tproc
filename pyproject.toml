[build-system]
requires = ['setuptools>=77.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'tproc'
dynamic = ['version']
description = 'A small yet powerful text processor'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
authors = [
  {name = 'Ivan Kosarev', email = 'mail@ivankosarev.com'}
]
requires-python = '>=3.10'
keywords = ['text', 'macro', 'processing']
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Environment :: Console',
  'Intended Audience :: Developers',
  'Intended Audience :: Information Technology',
  'Intended Audience :: Science/Research',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Programming Language :: Python :: Implementation :: CPython',
  'Topic :: Documentation',
  'Topic :: Software Development',
  'Topic :: Software Development :: Pre-processors',
  'Topic :: Text Processing',
  'Topic :: Text Processing :: General',
  'Topic :: Text Processing :: Markup',
  'Topic :: Utilities',
]

[project.urls]
Homepage = 'https://github.com/kosarev/tproc/'

[project.scripts]
tproc = 'tproc:main'

[tool.setuptools]
packages = ['tproc']

[tool.setuptools.dynamic]
version = {attr = 'tproc._version.__version__'}

[tool.setuptools.package-data]
# py.typed is the PEP 561 marker telling type checkers the package
# carries type information.
tproc = ['py.typed']

[tool.pytest.ini_options]
testpaths = ['tests']
